[project]
name = "moonraker-mcp"
version = "0.2.0"
description = "MCP server for controlling a Klipper 3D printer through the Moonraker API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Moonraker MCP contributors" }]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.15",
]

[project.scripts]
moonraker-mcp = "moonraker_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moonraker_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # upstream code is not reformatted, to keep merges from nixkor/moonraker-mcp easy
